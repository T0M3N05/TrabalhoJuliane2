spring.application.name=estoque

# Conexão com o PostgreSQL (crie antes o banco "estoque" no pgAdmin/psql)
spring.datasource.url=jdbc:postgresql://localhost:5432/estoque
spring.datasource.username=postgres
spring.datasource.password=1234

# JPA / Hibernate
# update = cria/atualiza a tabela automaticamente sem apagar os dados ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
